[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
thiserror = "=2.0.21"
uuid = { version = "=1.29.2", features = ["v4", "v5", "serde"] }
sha2 = "=0.11.1"
hex = "=0.4.3"
bytes = "=1.12.1"
base64 = "=0.23.1"
rand = "=0.10.3"
zeroize = { version = "=1.9.1", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
clap = { version = "=4.6.7", features = ["derive"] }
tempfile = "=3.27.0"
unicode-normalization = "=0.1.26"
unicode-casefold = "=0.2.0"
rusqlite = { version = "=0.42.0", features = ["bundled", "backup", "wal"] }
windows = "=0.62.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy", "json", "stream"] }
openidconnect = { version = "=4.1.0", default-features = false }
aws-sdk-s3 = "=1.159.0"
aws-credential-types = "=1.3.1"
hf-hub = { git = "https://github.com/huggingface/hf-hub", rev = "473de9430b0fbc544fb1d91102180eb713f8dc87", default-features = false, features = ["rustls-tls"] }
hf-xet = { version = "=1.8.1", default-features = false, features = ["rustls-tls"] }
xet-client = { version = "=1.8.1", default-features = false, features = ["rustls-tls"] }
eventsource-stream = "=0.2.3"
futures-util = "=0.3.34"
hfdrive-core = { path = "crates/hfdrive-core" }
hfdrive-state = { path = "crates/hfdrive-state" }
hfdrive-auth = { path = "crates/hfdrive-auth" }
hfdrive-hf = { path = "crates/hfdrive-hf" }
hfdrive-publication = { path = "crates/hfdrive-publication" }
hfdrive-windows = { path = "crates/hfdrive-windows" }
hfdrive-protocol = { path = "crates/hfdrive-protocol" }

[patch.crates-io]
xet-client = { path = "vendor/xet-core/xet-client" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
